; Comskip settings shipped with JellyJob. To tune detection, copy this file into the data volume and
; point JellyJob__ComskipIniPath at the copy.
;
; Comskip finds each setting by searching the file for "name=", so don't write a setting's name followed
; by "=" inside a comment: it would be read as the value.
;
; JellyJob only reads the .edl back, and rewrites it itself for Mark mode (type 3, commercial), so the
; skip type comskip writes into the .edl doesn't matter.

; Sum of detection methods: 1 black frames, 2 logo, 4 scene changes, 8 fuzzy logic, 32 aspect ratio,
; 64 silence. 111 is the usual choice for US over-the-air broadcasts.
detect_method=111
verbose=0

; Only the .edl; skip the default .txt cut list.
output_default=0
output_edl=1
